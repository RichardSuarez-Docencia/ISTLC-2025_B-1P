<h1>Actor</h1>
<button matButton="filled">Crear Actor</button>


<mat-form-field>
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!-- Position Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> id </th>
    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef> nombre </th>
    <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="fechaNacimiento">
    <th mat-header-cell *matHeaderCellDef> fechaNacimiento </th>
    <td mat-cell *matCellDef="let element"> {{element.fechaNacimiento}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="nacionalidad">
    <th mat-header-cell *matHeaderCellDef> nacionalidad </th>
    <td mat-cell *matCellDef="let element"> {{element.nacionalidad}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="imagen">
    <th mat-header-cell *matHeaderCellDef> imagen </th>
    <td mat-cell *matCellDef="let element">
       <img style="width: 40px; border-radius: 100%;" src="{{element.imagen}}" alt="">
    </td>
  </ng-container>

  <ng-container matColumnDef="accion">
    <th mat-header-cell *matHeaderCellDef> Acción </th>
    <td mat-cell *matCellDef="let element">
          <button matButton="filled">Editar</button>
          <button matButton="filled" style="background-color: red;">Eliminar</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  <!-- Row shown when there is no matching data. -->
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
  </tr>
</table>
