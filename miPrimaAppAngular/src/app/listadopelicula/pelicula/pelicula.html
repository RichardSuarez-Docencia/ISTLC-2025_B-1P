<h1>Pelicula</h1>
<button matButton="filled" routerLink="/crearPelicula">Crear Pelicula</button>

<mat-form-field>
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!-- Position Column -->
  <ng-container matColumnDef="idPelicula">
    <th mat-header-cell *matHeaderCellDef> No. </th>
    <td mat-cell *matCellDef="let element"> {{element.idPelicula}} </td>
  </ng-container>

  <!-- Position Column -->
  <ng-container matColumnDef="nombrePelicula">
    <th mat-header-cell *matHeaderCellDef> Pelicula </th>
    <td mat-cell *matCellDef="let element"> {{element.nombrePelicula}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="poster">
    <th mat-header-cell *matHeaderCellDef> Poster </th>
    <td mat-cell *matCellDef="let element"> <img src="{{element.poster}}" style="width: 60px;" alt=""> </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="genero">
    <th mat-header-cell *matHeaderCellDef> Genero </th>
    <td mat-cell *matCellDef="let element"> {{element.genero}} </td>
  </ng-container>

   <!-- Symbol Column -->
  <ng-container matColumnDef="descripcion">
    <th mat-header-cell *matHeaderCellDef> Descripción </th>
    <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="trailer">
    <th mat-header-cell *matHeaderCellDef> Trailer </th>
    <td mat-cell *matCellDef="let element">
      <img src="{{element.trailer}}" style="width: 60px;" alt="">  </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="actores">
    <th mat-header-cell *matHeaderCellDef> Actores </th>
    <td mat-cell *matCellDef="let element"> {{element.actores}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="accion">
    <th mat-header-cell *matHeaderCellDef> Acción </th>
    <td mat-cell *matCellDef="let element"> 
        <button matButton="filled">Editar</button> 
        <button matButton="filled" style="background-color: red;">Eliminar</button> </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  <!-- Row shown when there is no matching data. -->
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
  </tr>
</table>
