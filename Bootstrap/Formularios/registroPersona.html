<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    
    <h1>Registro de Trabajador</h1>

    <form method="get">
        <fieldset>
            <legend>Datos Personales</legend>
            <label for="">Foto</label>
            <input type="file" accept=".jpg">
            <label title="nombre" for="nombre">Nombre: <input placeholder="Escriba aquí su nombre" id="nombre" type="text" required value="Richard" readonly></label>&nbsp;&nbsp;&nbsp;
            <label title="Es obligatorio que escriba su apellido" for="apellido">Apellido: <input placeholder="Escriba aquí su apellido" id="apellido" name="apellido" type="text" required></label><br><br>
            <label  for="cedula">Identificación: <input placeholder="Escriba su numero de cedula" id="cedula" name="cedula" type="text" minlength="10" maxlength="10" required></label><br><br>
            <div>
                <label for="edad">Edad: <input placeholder="Escriba aquí su edad" name="edad" type="number" min="1" max="100"></label>
            </div>
            <br>
            <label for="fecha">Fecha de Nacimiento: <input placeholder="Fecha" name="fecha" type="date"></label>
            <br><br>
            <label for="sueldo">Sueldo: <input name="sueldo" placeholder="Escriba aquí su sueldo" type="number" step="500"></label>
            <br><br>
            <label for="">Sexo:</label>
             <label for="">Masculino <input type="radio" name="genero"></label>
             <label for="">Femenino <input type="radio" name="genero"></label>
             <br><br>
            <label for="">Idiomas</label><br>
            <label for="">Español: <input type="checkbox" name="idioma"></label>
            <label for="">Inglés: <input type="checkbox" name="idioma"></label>
            <br>
            <label for="">Nacionalidad:
                <select name="" id="">
                    <option value="01">Ecuador</option>
                    <option value="01">Mexico</option>
                    <option value="01">Pananmá</option>
                </select>
            </label>
            <br>
            <button type="submit">Enviar Formulario</button>
        </fieldset>
    </form>

</body>
</html>
