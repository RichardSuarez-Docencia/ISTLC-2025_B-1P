<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de venta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete" />
</head>

<body>

    <h1>Punto Venta Tuti-ISTLC</h1>

    <img src="https://thesimpsonsapi.com/character/1.webp" alt="">
    <div class="container">
        <div class="row">
            <div class="col">
                <div class="mb-3">
                    <label for="exampleFormControlInput1" class="form-label"><b>No Factura</b></label>
                    <input id="idNumeroFactura" type="text" class="form-control" id="exampleFormControlInput1"
                        value="FACT-08122025">
                </div>
            </div>
            <div class="col">
                <div class="mb-3">
                    <label for="exampleFormControlInput1" class="form-label"><b>Identificación</b></label>
                    <input id="idIdentificacion" type="text" class="form-control" id="exampleFormControlInput1"
                        value="0951836592">
                </div>
            </div>
            <div class="col">
                <div class="mb-3">
                    <label for="exampleFormControlInput1" class="form-label"><b>Cajero</b></label>
                    <input id="idCajero" type="text" class="form-control" id="exampleFormControlInput1"
                        value="Carlos Ramirez">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-4">
                <div class="input-group">
                    <input id="idProducto" type="text" class="form-control" placeholder="Buscar Producto">
                    <button onclick="buscarAgregarProducto()" class="btn btn-outline-primary"
                        type="button">Buscar</button>
                </div>
            </div>
        </div>
        <div class="row" style="margin: 5px 5px">
            <div class="col" id="idAlertaNotificacion">

            </div>
        </div>

        <div class="row">
            <div class="col-sm-8">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descripción</th>
                            <th>Cantidad</th>
                            <th>Total</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="detalle">

                    </tbody>
                </table>
            </div>
            <div class="col-sm-4">
                <div style="position: sticky; top: 0;">

                    <div class="mb-1">
                        <label for="exampleFormControlInput1" class="form-label"><b>SubTotal</b></label>
                        <input id="idSubtotal" type="text" class="form-control" value="$ 0.00"
                            style="text-align: center;background-color: black; color: rgb(134, 194, 43); font-weight: bold;">
                    </div>
                    <div class="mb-1">
                        <label for="exampleFormControlInput1" class="form-label"><b>Iva 15%</b></label>
                        <input id="idIva" readonly type="text" class="form-control" value="$ 0.0"
                            style="text-align: center;background-color: black; color: rgb(134, 194, 43); font-weight: bold;">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label"><b>Total a pagar</b></label>
                        <input id="idTotal" type="text" class="form-control" value="$ 0.00"
                            style="text-align: center;background-color: black; color: rgb(134, 194, 43); font-weight: bold;">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label"><b>Valor Recibido</b></label>
                        <input id="idValorRecibido" type="text" class="form-control" value="0.00"
                            style="text-align: center;background-color: black; color: rgb(134, 194, 43); font-weight: bold;">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label"><b>Cambio</b></label>
                        <input id="idCambio" type="text" class="form-control" value="0.00"
                            style="text-align: center;background-color: black; color: rgb(134, 194, 43); font-weight: bold;">
                    </div>
                    <div class="mb-3">
                        <button class="btn btn-danger" onclick="pagar()" style="width: 100%;">Pagar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
